<!-- fx-smoother · Lag + speed columns · block: parallax -->
<div data-scrolly="parallax" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:60px 0"><div data-speed="0.7" style="aspect-ratio:3/4;background:var(--sc-accent);color:var(--sc-on-accent);border-radius:var(--sc-radius);display:grid;place-items:center;font:600 14px var(--sc-font-mono)">speed 0.7</div><div data-speed="1.3" data-lag="0.6" style="aspect-ratio:3/4;background:var(--sc-accent-2);color:var(--sc-on-accent-2);border-radius:var(--sc-radius);display:grid;place-items:center;font:600 14px var(--sc-font-mono)">lag 0.6</div><div data-speed="1.15" style="aspect-ratio:3/4;background:var(--sc-accent-3);color:#fff;border-radius:var(--sc-radius);display:grid;place-items:center;font:600 14px var(--sc-font-mono)">speed 1.15</div><div data-speed="1.3" data-lag="1.2" style="aspect-ratio:3/4;background:var(--sc-accent-4);color:#121212;border-radius:var(--sc-radius);display:grid;place-items:center;font:600 14px var(--sc-font-mono)">lag 1.2</div><div data-speed="0.8" style="aspect-ratio:3/4;background:var(--sc-accent);color:var(--sc-on-accent);border-radius:var(--sc-radius);display:grid;place-items:center;font:600 14px var(--sc-font-mono)">speed 0.8</div></div>
