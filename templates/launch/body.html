<main>
  <div data-scrolly="particles" data-shapes="cloud,sphere,text:{{SHORT}},ring" data-chapter="00 · {{SHORT}}"></div>
  <header class="sc-section sc-wrap" style="min-height:70svh;display:grid;align-content:center">
    <p class="sc-kicker">{{KICKER}}</p>
    <h1 class="sc-display" data-scrolly="reveal" data-effect="clip">{{TITLE}}</h1>
    <p class="sc-lede">{{SUBTITLE}}</p>
  </header>
  <!-- Replace with your film: <div data-scrolly="video-scrub" data-src="assets/film.webm" data-fallback="assets/film.mp4" data-duration="8" data-poster="assets/poster.jpg"></div> -->
  <div data-scrolly="portal" style="background:var(--sc-accent-2)" data-chapter="01 · WHAT'S NEW"><p class="sc-display" style="color:var(--sc-on-accent)">Meet it.</p></div>
  <section class="sc-section sc-wrap"><div data-scrolly="stack">
    <article style="--c:var(--sc-accent)"><p class="sc-kicker" style="color:inherit">Feature 1</p><h3 class="sc-h2">The headline benefit</h3></article>
    <article style="--c:var(--sc-accent-2);--fg:var(--sc-on-accent-2)"><p class="sc-kicker" style="color:inherit">Feature 2</p><h3 class="sc-h2">The second benefit</h3></article>
    <article style="--c:var(--sc-accent-3);--fg:#fff"><p class="sc-kicker" style="color:inherit">Feature 3</p><h3 class="sc-h2">The third benefit</h3></article>
  </div></section>
  <section data-scrolly="horizontal" data-chapter="02 · DETAILS"><div class="sc-track">
    <article style="--c:var(--sc-surface)"><h3 class="sc-h2">Fast</h3><p>One line about speed.</p></article>
    <article style="--c:var(--sc-surface-2)"><h3 class="sc-h2">Simple</h3><p>One line about ease.</p></article>
    <article style="--c:var(--sc-surface)"><h3 class="sc-h2">Yours</h3><p>One line about control.</p></article>
    <article style="--c:var(--sc-accent);--fg:var(--sc-on-accent)"><h3 class="sc-h2">Ready</h3><p>Available today.</p></article>
  </div></section>
  <footer class="sc-section sc-wrap" style="min-height:70svh;display:grid;align-content:center" data-chapter="03 · GET IT">
    <h2 class="sc-display" data-scrolly="reveal">{{CTA_TITLE}}</h2>
    <p data-scrolly="magnetic" style="margin-top:24px"><a class="sc-btn" href="#">{{CTA}}</a> <a class="sc-btn ghost" href="#">Learn more</a></p>
  </footer>
</main>
